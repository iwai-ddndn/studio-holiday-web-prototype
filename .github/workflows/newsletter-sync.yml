# SubstackのRSSを毎日取得して data/newsletter.json を更新するワークフロー。
# 変更があったときだけコミットされ、GitHub Pagesが自動で再デプロイされる。
# 手動実行: Actionsタブ → Sync newsletter from Substack → Run workflow
name: Sync newsletter from Substack

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 JST 6:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feed and build JSON
        run: python3 scripts/fetch_newsletter.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/newsletter.json
          git diff --cached --quiet || { git commit -m "chore: Substackニュースレターを自動同期"; git push; }
